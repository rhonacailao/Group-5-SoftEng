<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="CashWell, a personal finance tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#053b06"/><stop offset="1" stop-color="#0b5d1e"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0dab76" stop-opacity=".45"/><stop offset="1" stop-color="#0dab76" stop-opacity="0"/></linearGradient>
    <clipPath id="reveal"><rect x="560" y="0" width="0" height="300"><animate attributeName="width" from="0" to="440" dur="2.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1" keyTimes="0;1"/></rect></clipPath>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".06">
    <path d="M0 75H1000M0 150H1000M0 225H1000"/>
  </g>
  <!-- the chart draws itself, left to right -->
  <g clip-path="url(#reveal)">
    <path d="M560 230 L620 200 L680 215 L740 150 L800 170 L860 100 L920 120 L980 60 L980 300 L560 300Z" fill="url(#area)"/>
    <path d="M560 230 L620 200 L680 215 L740 150 L800 170 L860 100 L920 120 L980 60" fill="none" stroke="#5ee0a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="980" cy="60" r="7" fill="#f5b83d" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur=".3s" fill="freeze"/><animate attributeName="r" values="7;12;7" begin="2.8s" dur="1.8s" repeatCount="indefinite"/></circle>
  <!-- floating coins -->
  <g fill="#f5b83d" stroke="#e8a317" stroke-width="3">
    <g><circle cx="470" cy="250" r="16"/><text x="470" y="256" font-size="18" font-weight="700" fill="#9a6508" stroke="none" text-anchor="middle" font-family="Georgia,serif">$</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="3.2s" repeatCount="indefinite"/></g>
    <g><circle cx="520" cy="95" r="11"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="2.6s" begin="-1s" repeatCount="indefinite"/></g>
    <g><circle cx="905" cy="250" r="13"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="3.6s" begin="-2s" repeatCount="indefinite"/></g>
  </g>
  <!-- title -->
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif">
    <g transform="translate(60 92)" opacity="0">
      <rect width="56" height="56" fill="#0dab76"/>
      <path d="M14 30l9 9 19-21" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" from="0" to="1" begin=".1s" dur=".6s" fill="freeze"/>
    </g>
    <text x="134" y="136" font-size="58" font-weight="800" fill="#fff" opacity="0">CashWell<animate attributeName="opacity" from="0" to="1" begin=".3s" dur=".7s" fill="freeze"/><animate attributeName="x" from="110" to="134" begin=".3s" dur=".7s" fill="freeze"/></text>
    <text x="62" y="190" font-size="22" fill="#cfeedd" opacity="0">See where your money goes.<animate attributeName="opacity" from="0" to="1" begin=".9s" dur=".8s" fill="freeze"/></text>
    <g font-size="14" font-weight="700" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur=".8s" fill="freeze"/>
      <rect x="62" y="215" width="96" height="30" rx="15" fill="#0dab76"/><text x="110" y="235" fill="#fff" text-anchor="middle">React 19</text>
      <rect x="168" y="215" width="96" height="30" rx="15" fill="#0dab76"/><text x="216" y="235" fill="#fff" text-anchor="middle">FastAPI</text>
      <rect x="274" y="215" width="96" height="30" rx="15" fill="#f5b83d"/><text x="322" y="235" fill="#5c3b00" text-anchor="middle">Postgres</text>
    </g>
  </g>
</svg>
